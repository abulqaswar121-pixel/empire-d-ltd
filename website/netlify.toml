# ══════════════════════════════════════════════════════════════════════════
#  EMPIRE D LTD — Netlify configuration
#
#  Build:    node build.js   → produces the static site in /public
#  Deploy:   connect this repository in Netlify, or drag the /public folder
#            into the Netlify dashboard (Netlify Drop).
#
#  Netlify Forms: the contact form is detected automatically at deploy time
#  (it uses data-netlify="true"). No extra configuration is required.
# ══════════════════════════════════════════════════════════════════════════

[build]
  command = "node build.js"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

# ── Security & privacy headers ────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ── Caching ───────────────────────────────────────────────────────────────
# Images and fonts: safe to cache for a long time (replace the file name if
# you swap a photograph, or re-deploy and browsers will revalidate).
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Styles and scripts: revalidate so edits appear immediately.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Friendly URLs ─────────────────────────────────────────────────────────
# Folder-based pages (/about/index.html) are served at /about/ automatically.
[[redirects]]
  from = "/quote"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/quote-request"
  to = "/contact/"
  status = 301
