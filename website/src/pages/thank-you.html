<!-- ═══════════════════════════════════════════════════════════════════════
     THANK YOU — Netlify Forms redirect target
     ═══════════════════════════════════════════════════════════════════════ -->

<main id="main">
  <section class="status-page" aria-labelledby="page-title">
    <div class="wrap status-page__inner">
      <span class="status-page__check" aria-hidden="true">
        <svg class="icon" focusable="false"><use href="#i-check"></use></svg>
      </span>
      <p class="eyebrow">Enquiry received</p>
      <h1 id="page-title">Thank you — your message is with us.</h1>
      <p>
        A member of the {{company.name}} team will respond within one business day
        ({{hoursLine}}). If it is urgent, WhatsApp is the
        quickest way to reach us.
      </p>
      <div class="btn-row">
        <a class="btn btn--light btn--lg" href="/">
          Back to home
          <svg class="icon icon--arrow" aria-hidden="true" focusable="false"><use href="#i-arrow-right"></use></svg>
        </a>
        <a class="btn btn--ghost btn--lg" href="{{links.whatsapp}}" target="_blank" rel="noopener">
          <svg class="icon icon--fill" aria-hidden="true" focusable="false"><use href="#i-whatsapp"></use></svg>
          Chat on WhatsApp
        </a>
      </div>
    </div>
  </section>
</main>
